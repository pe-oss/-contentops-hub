{% extends "base.html" %}

{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>Đổi mật khẩu</h1>
  <form method="post" class="form-grid">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Cập nhật mật khẩu</button>
  </form>
</section>
{% endblock %}
