{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>Đăng nhập</h1>
  <form method="post" class="form-grid">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Đăng nhập</button>
  </form>
  <p class="muted">Chưa có tài khoản? <a href="{% url 'accounts:register' %}">Đăng ký ngay</a>.</p>
</section>
{% endblock %}
